# Profil Docker — hôtes réseau compose (postgres, redis, minio)
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/fretcorridor

  jpa:
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379

minio:
  endpoint: http://minio:9000

logging:
  level:
    com.flysoft: INFO
    org.springframework.security: INFO
