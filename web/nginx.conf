server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Résolution DNS Docker dynamique (évite le crash si backend démarre après)
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:8080;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ne pas renvoyer index.html pour les assets manquants (évite page blanche)
  location ~* \.(js|css|map|png|jpg|jpeg|gif|webp|svg|ico|woff2?|mp4|webm)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }
}
