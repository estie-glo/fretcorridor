<div class="shell">
  <header class="shell__header">
    <div class="shell__header-inner">
      <div class="shell__brand">
        <app-brand-logo size="sm" />
        @if (tenantName()) {
          <span class="shell__tenant">{{ tenantName() }}</span>
        }
      </div>

      <app-shell-nav />

      <div class="shell__actions">
        <app-language-switcher />
        <button type="button" class="fc-btn fc-btn--ghost fc-btn--sm" (click)="logout()">
          {{ 'AUTH.LOGOUT' | translate }}
        </button>
      </div>
    </div>
  </header>

  <main class="shell__main">
    <div class="shell__main-inner">
      <router-outlet />
    </div>
  </main>

  <app-toast-host />
</div>
