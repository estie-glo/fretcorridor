name: fretcorridor_mobile
description: Application mobile FretCorridor — Chauffeur & Agent
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # HTTP Client avec intercepteurs
  dio: ^5.4.0

  # Stockage sécurisé (JWT)
  flutter_secure_storage: ^10.3.1

  # GPS
  geolocator: ^14.0.3

  # Base de données locale (offline-first)
  sqflite: ^2.3.0
  path: ^1.8.3

  # UUID (idempotence)
  uuid: ^4.3.3

  # Connectivité réseau
  connectivity_plus: ^7.2.0

  # Interface
  image_picker: ^1.2.3
  # Polices
  google_fonts: ^6.2.1
  # Téléphone avec indicatif pays
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
